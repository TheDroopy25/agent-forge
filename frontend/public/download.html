<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download AgentForge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0f;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .card {
      background: #12121a;
      border: 1px solid #1e2d3d;
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 520px;
      width: 100%;
      text-align: center;
    }
    .logo { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    .subtitle { color: #8b9cb3; font-size: 15px; margin-bottom: 40px; line-height: 1.5; }
    .primary-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #76b900;
      color: #000;
      font-weight: 700;
      font-size: 16px;
      padding: 14px 28px;
      border-radius: 10px;
      text-decoration: none;
      margin-bottom: 12px;
      transition: opacity 0.2s;
    }
    .primary-btn:hover { opacity: 0.9; }
    .os-note { color: #4a5568; font-size: 13px; margin-bottom: 32px; }
    .divider { border: none; border-top: 1px solid #1e2d3d; margin: 24px 0; }
    .other-label { color: #4a5568; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; }
    .other-links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .other-btn {
      background: transparent;
      border: 1px solid #1e2d3d;
      color: #8b9cb3;
      font-size: 13px;
      padding: 8px 18px;
      border-radius: 8px;
      text-decoration: none;
      transition: border-color 0.2s, color 0.2s;
    }
    .other-btn:hover { border-color: #76b900; color: #fff; }
    .note {
      margin-top: 32px;
      padding: 16px;
      background: #0d1a24;
      border-radius: 10px;
      font-size: 13px;
      color: #8b9cb3;
      line-height: 1.6;
    }
    .note a { color: #76b900; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">⚡</div>
    <h1>Download AgentForge</h1>
    <p class="subtitle">Build and deploy your own AI agent — no coding required.</p>

    <div id="primary-download"></div>

    <hr class="divider" />
    <p class="other-label">Other platforms</p>
    <div class="other-links" id="other-downloads"></div>

    <div class="note">
      After installing, AgentForge will check if <a href="https://nodejs.org" target="_blank">Node.js</a> is installed and walk you through the rest. <strong>No technical experience needed.</strong>
    </div>
  </div>

  <script>
    const RELEASES = "https://github.com/TheDroopy25/agent-forge/releases/latest";

    const platforms = [
      {
        id: "mac",
        label: "Download for Mac",
        icon: "🍎",
        note: "Works on Apple Silicon (M1/M2/M3) and Intel Macs",
        url: RELEASES,
        detect: () => /Mac|iPhone|iPad/.test(navigator.userAgent),
      },
      {
        id: "windows",
        label: "Download for Windows",
        icon: "🪟",
        note: "Windows 10 or 11, 64-bit",
        url: RELEASES,
        detect: () => /Win/.test(navigator.userAgent),
      },
      {
        id: "linux",
        label: "Download for Linux",
        icon: "🐧",
        note: "AppImage — works on most Linux distros",
        url: RELEASES,
        detect: () => /Linux/.test(navigator.userAgent),
      },
    ];

    const detected = platforms.find((p) => p.detect()) || platforms[0];
    const others = platforms.filter((p) => p.id !== detected.id);

    document.getElementById("primary-download").innerHTML = `
      <a href="${detected.url}" class="primary-btn" target="_blank">
        <span>${detected.icon}</span>
        <span>${detected.label}</span>
      </a>
      <p class="os-note">${detected.note}</p>
    `;

    document.getElementById("other-downloads").innerHTML = others
      .map((p) => `<a href="${p.url}" class="other-btn" target="_blank">${p.icon} ${p.label.replace("Download for ", "")}</a>`)
      .join("");
  </script>
</body>
</html>
